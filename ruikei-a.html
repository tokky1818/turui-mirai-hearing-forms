<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>つるい未来補助金 ヒアリングフォーム（類型A）</title>
<style>
:root{
  --bg:#f2f5f3;
  --surface:#ffffff;
  --surface-alt:#eaf1ee;
  --text:#1a2624;
  --text-muted:#5c6f6a;
  --border:#d7e1dd;
  --border-strong:#c1cfc9;
  --accent:#1f6f5c;
  --accent-strong:#154f42;
  --accent-soft:#e1efe9;
  --required:#96324a;
  --required-soft:#f4e3e7;
  --optional-text:#5c6f6a;
  --optional-soft:#eef2f0;
  --success:#1f6f5c;
  --danger:#a23b3b;
  --shadow:0 1px 2px rgba(20,40,35,.06),0 8px 24px -12px rgba(20,40,35,.18);
  --radius:12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1614;
    --surface:#161f1c;
    --surface-alt:#1b2521;
    --text:#e6ece9;
    --text-muted:#9db0ab;
    --border:#2b3733;
    --border-strong:#3a4844;
    --accent:#4fae93;
    --accent-strong:#6fcaad;
    --accent-soft:#1c332c;
    --required:#e08fa2;
    --required-soft:#3a2229;
    --optional-text:#9db0ab;
    --optional-soft:#1f2925;
    --success:#63c79a;
    --danger:#d98a8a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1614;
  --surface:#161f1c;
  --surface-alt:#1b2521;
  --text:#e6ece9;
  --text-muted:#9db0ab;
  --border:#2b3733;
  --border-strong:#3a4844;
  --accent:#4fae93;
  --accent-strong:#6fcaad;
  --accent-soft:#1c332c;
  --required:#e08fa2;
  --required-soft:#3a2229;
  --optional-text:#9db0ab;
  --optional-soft:#1f2925;
  --success:#63c79a;
  --danger:#d98a8a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  color-scheme: dark;
}
*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,.serif{font-family:"Shippori Mincho",serif;}
h1,h2,h3{text-wrap:balance;}
button{font-family:inherit;}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--text);}
.app-shell{display:flex;min-height:100vh;}
.rail{
  width:248px;flex:none;background:var(--surface);border-right:1px solid var(--border);
  padding:28px 18px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.rail-brand{font-family:"Shippori Mincho",serif;font-size:15px;line-height:1.5;color:var(--accent-strong);margin:0 0 22px;padding:0 6px;}
.rail-brand small{display:block;font-family:"Noto Sans JP",sans-serif;font-size:11px;color:var(--text-muted);margin-top:3px;font-weight:500;}
.rail-step{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;
  color:var(--text-muted);font-size:13.5px;margin-bottom:2px;transition:background .15s;
}
.rail-step:hover{background:var(--surface-alt);}
.rail-step.active{background:var(--accent-soft);color:var(--accent-strong);font-weight:600;}
.rail-dot{
  width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:700;border:1.5px solid var(--border-strong);color:var(--text-muted);background:var(--surface);
  font-variant-numeric:tabular-nums;
}
.rail-step.active .rail-dot{border-color:var(--accent);color:var(--accent-strong);}
.rail-step.done .rail-dot{background:var(--accent);border-color:var(--accent);color:#fff;}
.rail-step.done .rail-dot::after{content:"✓";}
.rail-step.done .rail-dot{font-size:0;}
.rail-step.done .rail-dot::after{font-size:12px;}
.rail-label-wrap{min-width:0;}
.rail-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rail-sub{font-size:10.5px;color:var(--text-muted);opacity:.8;font-variant-numeric:tabular-nums;}

.mobile-tracker{display:none;}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.main-scroll{flex:1;padding:32px 24px 140px;max-width:760px;width:100%;margin:0 auto;}
.block-header{margin-bottom:26px;}
.block-eyebrow{font-size:12px;letter-spacing:.06em;color:var(--accent-strong);font-weight:600;margin:0 0 6px;}
.block-title{font-size:23px;margin:0 0 6px;color:var(--text);}
.block-subtitle{font-size:14px;color:var(--text-muted);margin:0;}
.block-note{
  margin-top:14px;background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;
  padding:11px 14px;font-size:12.5px;color:var(--text-muted);line-height:1.7;
}
.group-heading{
  font-size:14.5px;font-weight:700;color:var(--accent-strong);margin:34px 0 12px;padding-bottom:8px;
  border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:8px;
}
.group-heading:first-of-type{margin-top:0;}
.group-note{font-size:12px;color:var(--text-muted);margin:-6px 0 14px;line-height:1.7;}
.inline-note{
  font-size:12px;color:var(--text-muted);background:var(--surface-alt);border:1px solid var(--border);
  border-radius:10px;padding:10px 14px;margin:-4px 0 14px;line-height:1.75;
}
.skip-box{
  background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:20px;
}
.skip-label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:13px;line-height:1.7;color:var(--accent-strong);}
.skip-label input{margin-top:3px;width:16px;height:16px;flex:none;accent-color:var(--accent);}
.block-jumpnav{display:flex;gap:6px;overflow-x:auto;margin:-6px 0 24px;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
.jump-chip{
  flex:none;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;
  padding:6px 12px;border-radius:99px;border:1.5px solid var(--border-strong);background:var(--surface);
  color:var(--text-muted);cursor:pointer;font-weight:600;
}
.jump-chip:hover{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft);}
.done-box{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius);padding:14px 16px;margin-bottom:20px;}
.done-box h4{margin:0 0 4px;font-size:13px;color:var(--accent-strong);}
.done-box p{margin:0;font-size:12px;color:var(--text-muted);line-height:1.7;}
textarea.q-input.short{min-height:46px;}
.qcard[hidden],.grp[hidden],.na-note[hidden]{display:none;}
.na-note{background:var(--surface-alt);border:1px dashed var(--border-strong);border-radius:var(--radius);padding:18px 16px;font-size:13px;color:var(--text-muted);line-height:1.8;margin-bottom:14px;}
.rail-step.na{opacity:.45;}
.rail-step.na .rail-title::after{content:"（対象外）";font-size:10.5px;}
.mt-pill.na{opacity:.45;}
.doc-chip.on-mid{background:var(--required-soft);border-color:var(--required);color:var(--required);}
.doc-chip.on-todo{background:var(--optional-soft);border-color:var(--border-strong);color:var(--text);}
.usage-item b{min-width:104px;}
.info-list{margin:0;padding:0;list-style:none;display:grid;gap:7px;}
.info-list li{font-size:12.5px;line-height:1.75;color:var(--text-muted);display:flex;gap:10px;}
.info-list li b{color:var(--text);flex:none;min-width:88px;font-weight:700;}
.cover-caveat{font-size:11.5px;color:var(--text-muted);margin:10px 0 0;line-height:1.7;}
.footer-saved{font-size:10.5px;color:var(--text-muted);opacity:.75;margin-left:8px;font-variant-numeric:tabular-nums;}

.qcard{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 18px 20px;margin-bottom:14px;box-shadow:var(--shadow);
}
.qcard.answered{border-color:var(--border-strong);}
.q-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.q-no{font-size:11.5px;font-weight:700;color:var(--text-muted);font-variant-numeric:tabular-nums;}
.badge{font-size:10.5px;font-weight:700;padding:2.5px 8px;border-radius:99px;letter-spacing:.02em;}
.badge.req{background:var(--required-soft);color:var(--required);}
.badge.opt{background:var(--optional-soft);color:var(--optional-text);}
.q-label{font-size:15.5px;font-weight:600;margin:2px 0 5px;line-height:1.5;}
.q-prompt{font-size:13px;color:var(--text-muted);line-height:1.7;margin:0 0 10px;}
.q-example{
  font-size:12px;color:var(--text-muted);background:var(--surface-alt);border-radius:8px;
  padding:7px 10px;margin-bottom:10px;line-height:1.6;
}
.q-example b{color:var(--accent-strong);font-weight:700;}
.q-input, select.q-input{
  width:100%;border:1.5px solid var(--border-strong);border-radius:9px;padding:10px 12px;
  background:var(--surface);color:var(--text);transition:border-color .15s,box-shadow .15s;
}
textarea.q-input{min-height:80px;resize:none;overflow:hidden;line-height:1.6;}
.q-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
select.q-input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-muted) 50%),linear-gradient(135deg,var(--text-muted) 50%,transparent 50%);background-position:calc(100% - 20px) center,calc(100% - 15px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px;}

.invitem{border:1.5px dashed var(--border-strong);border-radius:var(--radius);padding:16px 16px 4px;margin-bottom:16px;background:var(--surface-alt);}
.invitem-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.invitem-title{font-weight:700;font-size:14.5px;color:var(--accent-strong);}
.invitem .qcard{background:var(--surface);}
.btn-remove{font-size:12px;color:var(--danger);background:none;border:none;cursor:pointer;padding:4px 6px;}
.btn-add{
  display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;
  border:1.5px dashed var(--border-strong);border-radius:var(--radius);background:none;color:var(--accent-strong);
  font-weight:600;font-size:13.5px;cursor:pointer;margin-bottom:16px;
}
.btn-add:hover{background:var(--accent-soft);}

.doc-row{
  display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;margin-bottom:8px;background:var(--surface);flex-wrap:wrap;
}
.doc-main{flex:1;min-width:200px;}
.doc-label{font-size:13.5px;line-height:1.6;margin-bottom:8px;}
.doc-state{display:flex;gap:6px;}
.doc-chip{
  font-size:11.5px;padding:5px 10px;border-radius:99px;border:1.5px solid var(--border-strong);
  background:var(--surface);color:var(--text-muted);cursor:pointer;font-weight:600;white-space:nowrap;
}
.doc-chip.on-ready{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);}
.doc-chip.on-none{background:var(--optional-soft);border-color:var(--border-strong);color:var(--text-muted);}
.doc-note{margin-top:8px;}
.doc-note input{width:100%;font-size:12.5px;padding:7px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);}
.doc-sub-heading{font-size:12.5px;font-weight:700;color:var(--text-muted);margin:16px 0 8px;padding-left:2px;}

.footer-bar{
  position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);
  padding:12px 24px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;
  box-shadow:0 -6px 18px -12px rgba(0,0,0,.15);
}
.footer-progress{flex:1;min-width:0;}
.footer-progress-text{font-size:11.5px;color:var(--text-muted);margin-bottom:5px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;}
.footer-bar-track{height:6px;border-radius:99px;background:var(--optional-soft);overflow:hidden;}
.footer-bar-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .25s;}
.btn{
  font-size:13.5px;font-weight:700;padding:10px 18px;border-radius:9px;border:1.5px solid var(--border-strong);
  background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap;
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:var(--accent-strong);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.ghost{border-color:transparent;color:var(--text-muted);}

.cover-wrap{max-width:640px;margin:0 auto;padding:44px 22px 60px;}
.cover-title{font-size:26px;line-height:1.5;margin:0 0 8px;}
.cover-sub{font-size:13px;color:var(--text-muted);margin:0 0 28px;}
.cover-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 20px 22px;box-shadow:var(--shadow);margin-bottom:18px;}
.cover-card h3{font-size:14.5px;margin:0 0 10px;color:var(--accent-strong);}
.cover-card p{font-size:13px;line-height:1.85;color:var(--text-muted);margin:0 0 8px;}
.usage-grid{display:grid;gap:9px;}
.usage-item{display:flex;gap:10px;font-size:12.5px;line-height:1.7;color:var(--text-muted);}
.usage-item b{color:var(--text);flex:none;min-width:70px;font-weight:700;}
.field-row{margin-bottom:14px;}
.field-row label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px;color:var(--text);}
.resume-note{
  font-size:12px;background:var(--accent-soft);color:var(--accent-strong);border-radius:9px;padding:9px 12px;
  margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
}
.resume-note button{font-size:11.5px;background:none;border:none;color:var(--danger);cursor:pointer;text-decoration:underline;padding:0;}
.hash-resume-note{background:var(--required-soft);color:var(--required);}
.btn-sm{padding:6px 12px;font-size:11.5px;}
.qr-panel{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);text-align:center;}
.qr-canvas{display:inline-block;background:#fff;padding:10px;border-radius:10px;line-height:0;}
.qr-hint{font-size:11.5px;color:var(--text-muted);margin:10px 0;line-height:1.7;}
.start-btn{width:100%;padding:14px;font-size:15px;margin-top:6px;border-radius:10px;}

.review-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px;}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.stat-num{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent-strong);}
.stat-label{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
.missing-box{background:var(--required-soft);border:1px solid var(--required);border-radius:var(--radius);padding:14px 16px;margin-bottom:20px;}
.missing-box h4{margin:0 0 8px;font-size:13px;color:var(--required);}
.missing-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;}
.missing-list li a{font-size:12.5px;color:var(--required);text-decoration:none;cursor:pointer;}
.missing-list li a:hover{text-decoration:underline;}
.save-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px;}
.save-section h3{font-size:14.5px;margin:0 0 4px;}
.save-section p.hint{font-size:12px;color:var(--text-muted);margin:0 0 14px;}
.save-btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.save-btn-row .btn{flex:1;min-width:150px;}
.copy-area{width:100%;min-height:120px;font-size:11.5px;font-family:ui-monospace,monospace;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-alt);color:var(--text-muted);}
.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--text);color:var(--bg);
  padding:9px 18px;border-radius:99px;font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.reset-link{font-size:11.5px;color:var(--text-muted);text-align:center;margin-top:8px;}
.reset-link a{color:var(--text-muted);cursor:pointer;}

@media (max-width:880px){
  .rail{display:none;}
  .mobile-tracker{
    display:flex;gap:6px;overflow-x:auto;padding:12px 14px;background:var(--surface);
    border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;-webkit-overflow-scrolling:touch;
  }
  .mt-pill{
    flex:none;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;
    border:1.5px solid var(--border-strong);font-size:11.5px;color:var(--text-muted);white-space:nowrap;cursor:pointer;
  }
  .mt-pill.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);font-weight:700;}
  .mt-pill.done{background:var(--accent);border-color:var(--accent);color:#fff;}
  .main-scroll{padding:20px 16px 130px;}
  .footer-bar{padding:10px 14px calc(10px + env(safe-area-inset-bottom));}
  .btn{padding:10px 14px;}
  .review-stats{grid-template-columns:1fr 1fr;}
}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div class="app-shell">
  <nav class="rail" id="rail"></nav>
  <div class="main-col">
    <div class="mobile-tracker" id="mobileTracker"></div>
    <div class="main-scroll" id="mainScroll"></div>
    <div class="footer-bar" id="footerBar"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- data (build.py が生成) ---------------- */

const STORAGE_KEY = "turui_hearing_" + FORM.key + "_v1";
const FORM_ID = "turui-" + FORM.key + "-v1";

/* ---------------- state ---------------- */
let state = { answers:{}, step:0 };
try{
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){ const parsed = JSON.parse(raw); if(parsed && typeof parsed==="object"){ state = Object.assign(state, parsed); } }
}catch(e){}
if(!state.answers) state.answers = {};
let hasResumed = Object.keys(state.answers).some(k=>k!=="R_DATE" && String(state.answers[k]).trim()!=="");
if(!state.answers.R_DATE){
  const d = new Date(); state.answers.R_DATE = d.toISOString().slice(0,10);
}

const BLOCKS = FORM.blocks;
const STEP_META = [{key:"cover", label:"はじめに"}]
  .concat(BLOCKS.map(b=>({key:b.id, label:b.railLabel})))
  .concat([{key:"docs", label:"提出書類チェック"}, {key:"review", label:"確認・保存"}]);
const STEP_DOCS = STEP_META.findIndex(s=>s.key==="docs");

const QUESTION_STEP = {};
BLOCKS.forEach((b,i)=>{ b.groups.forEach(g=>g.questions.forEach(q=>{ QUESTION_STEP[q.id] = i+1; })); });

let lastSavedAt = null;
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    lastSavedAt = new Date();
    updateSavedIndicator();
  }catch(e){}
}
let saveTimer=null;
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveState, 250); }
function updateSavedIndicator(){
  const el = document.getElementById("savedIndicator");
  if(!el) return;
  if(!lastSavedAt){ el.textContent = ""; return; }
  const hh = String(lastSavedAt.getHours()).padStart(2,"0");
  const mm = String(lastSavedAt.getMinutes()).padStart(2,"0");
  const ss = String(lastSavedAt.getSeconds()).padStart(2,"0");
  el.textContent = `最終保存 ${hh}:${mm}:${ss}`;
}

/* ---------------- 設問の表示制御（Excelの「状態」列と同じ規則） ---------------- */
function norm(v){ return String(v==null?"":v).split("　").join(" ").trim(); }

/* 戻り値: "na"(対象外) / "pending"(先に選択) / "ok"(回答対象) */
function qGate(q){
  if(!q.dependsOn) return "ok";
  for(const c of q.dependsOn){
    const v = norm(state.answers[c.id]);
    if(v==="") return "pending";
    if(c.hideIf==="eq" && v===c.val) return "na";
    if(c.hideIf==="ne" && v!==c.val) return "na";
  }
  return "ok";
}
function isVisible(q){ return qGate(q)==="ok"; }
function qStatus(q){
  const g = qGate(q);
  if(g==="na") return "対象外";
  if(g==="pending") return "先に選択";
  return norm(state.answers[q.id])==="" ? "未入力" : "入力済";
}

function allQuestions(){
  const list=[];
  BLOCKS.forEach(b=>b.groups.forEach(g=>g.questions.forEach(q=>list.push(Object.assign({_blockId:b.id}, q)))));
  return list;
}
function allVisibleQuestions(){ return allQuestions().filter(isVisible); }

/* ブロック単位の状態: "na"=記入不要 / "pending"=先に別の設問へ回答 / "ok" */
function blockGate(b){
  let pending=false;
  for(const g of b.groups) for(const q of g.questions){
    const s = qGate(q);
    if(s==="ok") return "ok";
    if(s==="pending") pending=true;
  }
  return pending ? "pending" : "na";
}
function stepIsNA(i){
  const meta = STEP_META[i];
  const b = BLOCKS.find(x=>x.id===meta.key);
  return !!b && blockGate(b)==="na";
}

function computeProgress(){
  const qs = allVisibleQuestions();
  let total=qs.length, done=0;
  qs.forEach(q=>{ if(norm(state.answers[q.id])!=="") done++; });
  return {total, done};
}
function progressText(p){ return `${p.done}/${p.total} 回答済み`; }

/* ---------------- cross-device transfer ---------------- */
let pendingResumePayload = null;
let qrPanelOpen = false;
const RESUME_LINK_LIMIT = 1800;

function utf8ToBase64(str){
  const bytes = new TextEncoder().encode(str);
  let binary = "";
  bytes.forEach(b => binary += String.fromCharCode(b));
  return btoa(binary);
}
function base64ToUtf8(str){
  const binary = atob(str);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function buildTransferPayload(){
  return { formId: FORM_ID, savedAt: new Date().toISOString(), answers: state.answers };
}
function buildResumeLink(){
  const encoded = utf8ToBase64(JSON.stringify(buildTransferPayload()));
  return { url: location.origin + location.pathname + "#resume=" + encodeURIComponent(encoded), size: encoded.length };
}
function applyPayloadToState(payload){
  state.answers = payload.answers || {};
  state.step = 0;
  saveState();
  hasResumed = Object.keys(state.answers).length>0;
}
function clearResumeHash(){
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
}
function checkResumeHash(){
  if(location.hash && location.hash.indexOf("#resume=")===0){
    try{
      const encoded = decodeURIComponent(location.hash.slice(8));
      const payload = JSON.parse(base64ToUtf8(encoded));
      if(payload && payload.formId===FORM_ID && payload.answers){ pendingResumePayload = payload; }
    }catch(e){}
  }
}
function exportProgressFile(){
  trySaveFile(safeFileBase()+"_進捗.json", JSON.stringify(buildTransferPayload(), null, 2), "application/json");
}
function importProgressFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const payload = JSON.parse(reader.result);
      if(!payload || payload.formId !== FORM_ID){ showToast("このフォーム用の進捗ファイルではないようです"); return; }
      if(!confirm("読み込んだ内容で、この端末の入力内容を上書きします。よろしいですか？")) return;
      applyPayloadToState(payload);
      showToast("進捗ファイルを読み込みました");
      renderAll();
    }catch(e){
      showToast("ファイルの読み込みに失敗しました。正しい進捗ファイルかご確認ください");
    }
  };
  reader.readAsText(file, "utf-8");
}
function renderQrPanel(){
  const {size} = buildResumeLink();
  if(size > RESUME_LINK_LIMIT){
    return `<div class="qr-panel"><p class="qr-hint">現在の入力量が多く、QRコード／リンクでは送れません。上の「進捗をファイルに保存」をご利用ください。</p></div>`;
  }
  return `<div class="qr-panel">
    <div class="qr-canvas" id="qrCanvas"></div>
    <p class="qr-hint">QRコードを別端末のカメラで読み取るか、下のボタンでリンクをコピーしてください。入力内容が含まれるリンクのため、第三者と共有しないようご注意ください。</p>
    <div class="save-btn-row"><button class="btn" id="btnCopyResumeLink">リンクをコピーする</button></div>
  </div>`;
}

function stepClass(i){
  let cls = i===state.step ? "active" : (i<state.step ? "done" : "");
  if(stepIsNA(i)) cls += " na";
  return cls;
}
function renderRail(){
  let html = `<p class="rail-brand">${esc(FORM.brand)}<small>${esc(FORM.typeName)}</small></p>`;
  STEP_META.forEach((s,i)=>{
    html += `<div class="rail-step ${stepClass(i)}" data-step="${i}"><span class="rail-dot">${i}</span><span class="rail-label-wrap"><div class="rail-title">${esc(s.label)}</div></span></div>`;
  });
  railEl.innerHTML = html;
  railEl.querySelectorAll(".rail-step").forEach(el=>{
    el.addEventListener("click", ()=>{ goStep(parseInt(el.dataset.step,10)); });
  });
}

function renderTracker(){
  let html="";
  STEP_META.forEach((s,i)=>{
    html += `<div class="mt-pill ${stepClass(i)}" data-step="${i}">${esc(s.label)}</div>`;
  });
  trackerEl.innerHTML = html;
  trackerEl.querySelectorAll(".mt-pill").forEach(el=>{
    el.addEventListener("click", ()=>{ goStep(parseInt(el.dataset.step,10)); });
  });
  const active = trackerEl.querySelector(".mt-pill.active");
  if(active) active.scrollIntoView({inline:"center", block:"nearest"});
}

function fieldHtml(q){
  const val = state.answers[q.id] ?? "";
  const answered = String(val).trim()!=="";
  let inputHtml="";
  if(q.type==="select"){
    inputHtml = `<select class="q-input" id="f_${q.id}" data-qid="${q.id}"><option value="">選択してください</option>` +
      q.options.map(o=>`<option value="${escAttr(o)}" ${o===val?"selected":""}>${esc(o)}</option>`).join("") + `</select>`;
  } else if(q.type==="textarea"){
    inputHtml = `<textarea class="q-input${q.short?" short":""}" id="f_${q.id}" data-qid="${q.id}" placeholder="ご回答（ない場合は「なし」）">${esc(val)}</textarea>`;
  } else {
    inputHtml = `<input class="q-input" type="text" id="f_${q.id}" data-qid="${q.id}" value="${escAttr(val)}" placeholder="ご回答をご記入ください"${q.inputmode?` inputmode="${q.inputmode}"`:""}>`;
  }
  return `<div class="qcard ${answered?'answered':''}" id="card_${q.id}" data-card="${q.id}" ${isVisible(q)?"":"hidden"}>
    <div class="q-top"><span class="q-no">${esc(q.id)}</span></div>
    <label class="q-label" for="f_${q.id}">${esc(q.label)}</label>
    ${q.prompt?`<p class="q-prompt">${esc(q.prompt)}</p>`:''}
    ${q.example?`<div class="q-example"><b>記入例：</b>${esc(q.example)}</div>`:''}
    ${inputHtml}
  </div>`;
}

    <div class="cover-card">
      <h3>■ 別の端末で続きを入力する</h3>
      <p>この端末に保存されている入力内容を、他のスマートフォンやパソコンに引き継ぐことができます。</p>
      <div class="save-btn-row">
        <button class="btn" id="btnExportProgress">進捗をファイルに保存</button>
        <button class="btn" id="btnImportProgress">ファイルから読み込む</button>
      </div>
      <input type="file" id="importFileInput" accept="application/json,.json" style="display:none">
      <button class="btn ghost" type="button" id="btnToggleQr" style="width:100%;margin-top:6px;">${qrPanelOpen ? "QRコード／リンクを閉じる" : "QRコード／リンクで送る（入力量が少ない場合）"}</button>
      ${qrPanelOpen ? renderQrPanel() : ''}
    </div>
  </div>`;
  return html;
}

function naNoteText(b){
  return blockGate(b)==="pending"
    ? "このブロックの設問は、先に前のブロックの設問へ回答すると表示されます。"
    : "これまでの回答内容により、このブロックはご記入不要です。「次へ」で先へお進みください。";
}

function renderBlockContent(b){
  let html = `<div class="block-header">
    <p class="block-eyebrow">${esc(b.eyebrow)}</p>
    <h2 class="block-title">${esc(b.title)}</h2>
    ${b.note?`<div class="block-note">${esc(b.note)}</div>`:''}
  </div>`;
  const navGroups = b.groups.map((g,idx)=> g.heading ? {heading:g.heading, id:`grp_${b.id}_${idx}`} : null).filter(Boolean);
  if(navGroups.length > 1){
    html += `<div class="block-jumpnav">` + navGroups.map(ng=>`<button type="button" class="jump-chip" data-jump-group="${ng.id}">${esc(ng.heading)}</button>`).join('') + `</div>`;
  }
  const gate = blockGate(b);
  html += `<div class="na-note" id="naNote" ${gate==="ok"?"hidden":""}>${esc(naNoteText(b))}</div>`;
  b.groups.forEach((g,idx)=>{
    const anyVisible = g.questions.some(isVisible);
    html += `<div class="grp" id="grp_${b.id}_${idx}" ${anyVisible?"":"hidden"}>`;
    if(g.heading) html += `<div class="group-heading">${esc(g.heading)}</div>`;
    g.questions.forEach(q=>{ html += fieldHtml(q); });
    html += `</div>`;
  });
  return html;
}

function renderChecklistBlock(){
  let html = `<div class="block-header">
    <p class="block-eyebrow">提出書類</p>
    <h2 class="block-title">ご提出いただきたい資料</h2>
    <div class="block-note">準備の状況を選んでください。資料はメール・郵送・手渡しのいずれでもかまいません。スマホで撮影した写真でも大丈夫です。</div>
  </div>`;
  html += FORM.docs.map(d=>{
    const st = state.answers["ST_"+d.id] || FORM.docStates[FORM.docDefault];
    const note = state.answers["NT_"+d.id] || "";
    const chips = FORM.docStates.map(s=>{
      let cls="";
      if(s===st){
        if(s==="準備済み") cls="on-ready";
        else if(s==="準備中") cls="on-mid";
        else if(s==="該当なし") cls="on-none";
        else cls="on-todo";
      }
      const mark = s==="準備済み"?"☑ ":(s==="準備中"?"◐ ":(s==="まだ"?"☐ ":"－ "));
      return `<button class="doc-chip ${cls}" data-doc-state="${d.id}" data-val="${s}">${mark}${s}</button>`;
    }).join("");
    return `<div class="doc-row"><div class="doc-main"><div class="doc-label">${esc(d.no)}. ${esc(d.label)}</div><div class="doc-state">${chips}</div>
      <div class="doc-note"><input type="text" placeholder="備考・メモ（任意）" data-doc-note="${d.id}" value="${escAttr(note)}"></div>
    </div></div>`;
  }).join("");
  return html;
}

function renderReview(){
  const p = computeProgress();
  const missing = allVisibleQuestions().filter(q=>norm(state.answers[q.id])==="");
  let html = `<div class="block-header">
    <p class="block-eyebrow">最終ステップ</p>
    <h2 class="block-title">内容の確認・保存</h2>
    <p class="block-subtitle">ここまでの回答を確認し、ファイルに保存またはコピーして、担当の支援者へお送りください。</p>
  </div>
  <div class="review-stats">
    <div class="stat-tile"><div class="stat-num">${p.done} / ${p.total}</div><div class="stat-label">回答済みの設問数</div></div>
    <div class="stat-tile"><div class="stat-num">${missing.length}</div><div class="stat-label">未回答の設問数</div></div>
  </div>`;
  if(missing.length){
    html += `<div class="missing-box"><h4>未回答の設問が ${missing.length} 件あります</h4><ul class="missing-list">` +
      missing.slice(0,20).map(q=>`<li><a data-jump="${q.id}">${esc(q.id)}：${esc(q.label)}</a></li>`).join("") +
      (missing.length>20?`<li>ほか ${missing.length-20} 件</li>`:"") + `</ul>
      <p style="margin:10px 0 0;font-size:11.5px;color:var(--text-muted);line-height:1.7;">当てはまらない・特にない場合は「なし」、わからない・未定の場合は「わからない」「未定」とご記入ください。</p></div>`;
  } else if(p.total>0) {
    html += `<div class="done-box"><h4>✓ すべての設問に回答済みです</h4><p>この内容で保存・送付いただけます。提出書類の準備状況もあわせてご確認ください。</p></div>`;
  }
  html += `<div class="save-section">
    <h3>📄 Excel・スプレッドシート用（CSV形式）</h3>
    <p class="hint">元のヒアリングシートの「回答一覧（支援者・AI読み込み用）」と同じ列構成（項目番号・ブロック・項目・おたずね・回答・状態）で保存します。支援者へお渡しする際に便利です。</p>
    <div class="save-btn-row"><button class="btn primary" id="btnSaveCsv">CSVファイルを保存する</button></div>
  </div>
  <div class="save-section">
    <h3>📝 メール・チャット用（テキスト形式）</h3>
    <p class="hint">読みやすい文章形式でまとめます。ファイル保存、またはコピーしてメールやLINEに貼り付けてご利用いただけます。</p>
    <div class="save-btn-row">
      <button class="btn primary" id="btnSaveTxt">テキストファイルを保存する</button>
      <button class="btn" id="btnCopyTxt">全文をコピーする</button>
    </div>
    <textarea class="copy-area" id="copyArea" readonly></textarea>
  </div>
  <p class="reset-link"><a id="btnResetBottom">回答をすべて消去して最初からやり直す</a></p>`;
  return html;
}

function renderStep(){
  const meta = STEP_META[state.step];
  let html="";
  if(meta.key==="cover") html = renderCover();
  else if(meta.key==="review") html = renderReview();
  else if(meta.key==="docs") html = renderChecklistBlock();
  else {
    const block = BLOCKS.find(b=>b.id===meta.key);
    html = `<div>${renderBlockContent(block)}</div>`;
  }
  mainScroll.innerHTML = html;
  attachStepEvents();
  if(meta.key==="review"){
    document.getElementById("copyArea").value = buildReadableText();
  }
  mainScroll.scrollTo({top:0});
}

function renderFooter(){
  const p = computeProgress();
  const pct = p.total ? Math.round((p.done/p.total)*100) : 0;
  const isCover = state.step===0, isReview = state.step===STEP_META.length-1;
  footerEl.innerHTML = `
    <div class="footer-progress">
      <div class="footer-progress-text"><span>${esc(STEP_META[state.step].label)}<span id="savedIndicator" class="footer-saved"></span></span><span>${progressText(p)}</span></div>
      <div class="footer-bar-track"><div class="footer-bar-fill" style="width:${pct}%"></div></div>
    </div>
    ${isCover?'':'<button class="btn" id="btnPrev">← 戻る</button>'}
    ${isReview?'':'<button class="btn primary" id="btnNext">'+(isCover?'始める':'次へ')+' →</button>'}
  `;
  const prev = document.getElementById("btnPrev");
  const next = document.getElementById("btnNext");
  if(prev) prev.addEventListener("click", ()=>stepBy(-1));
  if(next) next.addEventListener("click", ()=>{ if(isCover){ startFromCover(); } else { stepBy(1); } });
  updateSavedIndicator();
}

/* 記入不要（対象外）のブロックは「次へ／戻る」で自動的に飛ばす */
function stepBy(dir){
  let i = state.step + dir;
  while(i>0 && i<STEP_META.length-1 && stepIsNA(i)) i += dir;
  if(i<=0 && dir<0){ goStep(0); return; }
  goStep(i);
}
function startFromCover(){
  hasResumed = true;
  let i = 1;
  while(i<STEP_META.length-1 && stepIsNA(i)) i++;
  goStep(i);
}

function goStep(i){
  if(i<0||i>=STEP_META.length) return;
  state.step = i;
  saveState();
  renderAll();
}

function attachStepEvents(){
  mainScroll.querySelectorAll("[data-qid]").forEach(el=>{
    el.addEventListener("input", onFieldInput);
    el.addEventListener("change", onFieldInput);
  });
  mainScroll.querySelectorAll("[data-doc-state]").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.answers["ST_"+el.dataset.docState] = el.dataset.val;
      scheduleSave();
      const sc = mainScroll.scrollTop;
      renderStep(); renderFooter();
      mainScroll.scrollTop = sc;
    });
  });
  mainScroll.querySelectorAll("[data-doc-note]").forEach(el=>{
    el.addEventListener("input", ()=>{ state.answers["NT_"+el.dataset.docNote] = el.value; scheduleSave(); });
  });
  const btnStart = document.getElementById("btnStart");
  if(btnStart) btnStart.addEventListener("click", startFromCover);
  const btnReset = document.getElementById("btnReset");
  if(btnReset) btnReset.addEventListener("click", doReset);
  const btnResetBottom = document.getElementById("btnResetBottom");
  if(btnResetBottom) btnResetBottom.addEventListener("click", doReset);
  const btnApplyResumeHash = document.getElementById("btnApplyResumeHash");
  if(btnApplyResumeHash) btnApplyResumeHash.addEventListener("click", ()=>{
    applyPayloadToState(pendingResumePayload);
    pendingResumePayload = null;
    clearResumeHash();
    showToast("引き継ぎデータを読み込みました");
    renderAll();
  });
  const btnDismissResumeHash = document.getElementById("btnDismissResumeHash");
  if(btnDismissResumeHash) btnDismissResumeHash.addEventListener("click", ()=>{
    pendingResumePayload = null;
    clearResumeHash();
    renderStep();
  });
  const btnExportProgress = document.getElementById("btnExportProgress");
  if(btnExportProgress) btnExportProgress.addEventListener("click", exportProgressFile);
  const btnImportProgress = document.getElementById("btnImportProgress");
  const importFileInput = document.getElementById("importFileInput");
  if(btnImportProgress && importFileInput) btnImportProgress.addEventListener("click", ()=>importFileInput.click());
  if(importFileInput) importFileInput.addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(file) importProgressFile(file);
    e.target.value = "";
  });
  const btnToggleQr = document.getElementById("btnToggleQr");
  if(btnToggleQr) btnToggleQr.addEventListener("click", ()=>{ qrPanelOpen = !qrPanelOpen; renderStep(); });
  const qrCanvas = document.getElementById("qrCanvas");
  if(qrCanvas){
    if(window.QRCode){
      qrCanvas.innerHTML = "";
      new QRCode(qrCanvas, { text: buildResumeLink().url, width:180, height:180, correctLevel: QRCode.CorrectLevel.M });
    } else {
      qrCanvas.textContent = "QRコードを生成できませんでした。下のボタンでリンクをコピーしてください。";
    }
  }
  const btnCopyResumeLink = document.getElementById("btnCopyResumeLink");
  if(btnCopyResumeLink) btnCopyResumeLink.addEventListener("click", ()=>{
    const {url} = buildResumeLink();
    navigator.clipboard.writeText(url).then(()=>showToast("リンクをコピーしました")).catch(()=>showToast("コピーできませんでした"));
  });
  mainScroll.querySelectorAll("[data-jump]").forEach(el=>{
    el.addEventListener("click", ()=>{ jumpToQuestion(el.dataset.jump); });
  });
  const btnSaveCsv = document.getElementById("btnSaveCsv");
  if(btnSaveCsv) btnSaveCsv.addEventListener("click", saveCsv);
  const btnSaveTxt = document.getElementById("btnSaveTxt");
  if(btnSaveTxt) btnSaveTxt.addEventListener("click", saveTxt);
  const btnCopyTxt = document.getElementById("btnCopyTxt");
  if(btnCopyTxt) btnCopyTxt.addEventListener("click", copyTxt);
  mainScroll.querySelectorAll("[data-jump-group]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const target = document.getElementById(el.dataset.jumpGroup);
      if(target) target.scrollIntoView({behavior:"smooth", block:"start"});
    });
  });
  mainScroll.querySelectorAll("textarea.q-input").forEach(el=>{
    autoGrow(el);
    el.addEventListener("input", ()=>autoGrow(el));
  });
}
function autoGrow(el){
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}

/* 回答に応じて、設問カード・グループ・ブロックの表示を再計算する（入力欄は再描画しない） */
function refreshVisibility(){
  const meta = STEP_META[state.step];
  const b = BLOCKS.find(x=>x.id===meta.key);
  if(!b) return;
  b.groups.forEach((g,idx)=>{
    let any=false;
    g.questions.forEach(q=>{
      const card = document.getElementById("card_"+q.id);
      if(!card) return;
      const vis = isVisible(q);
      if(vis) any=true;
      if(card.hidden === vis){
        card.hidden = !vis;
        if(vis){ const ta = card.querySelector("textarea"); if(ta) autoGrow(ta); }
      }
    });
    const grp = document.getElementById(`grp_${b.id}_${idx}`);
    if(grp) grp.hidden = !any;
  });
  const naNote = document.getElementById("naNote");
  if(naNote){
    const gate = blockGate(b);
    naNote.hidden = gate==="ok";
    naNote.textContent = naNoteText(b);
  }
}

function onFieldInput(e){
  const id = e.target.dataset.qid;
  state.answers[id] = e.target.value;
  const card = document.getElementById("card_"+id);
  if(card){ card.classList.toggle("answered", String(e.target.value).trim()!=="") ; }
  scheduleSave();
  refreshVisibility();
  renderFooterLite();
  refreshNav();
}
function refreshNav(){
  railEl.querySelectorAll(".rail-step").forEach(el=>{
    el.classList.toggle("na", stepIsNA(parseInt(el.dataset.step,10)));
  });
  trackerEl.querySelectorAll(".mt-pill").forEach(el=>{
    el.classList.toggle("na", stepIsNA(parseInt(el.dataset.step,10)));
  });
}
function renderFooterLite(){
  const p = computeProgress();
  const pct = p.total ? Math.round((p.done/p.total)*100) : 0;
  const txt = footerEl.querySelector(".footer-progress-text span:last-child");
  const fill = footerEl.querySelector(".footer-bar-fill");
  if(txt) txt.textContent = progressText(p);
  if(fill) fill.style.width = pct+"%";
}

function jumpToQuestion(qid){
  const targetStep = QUESTION_STEP[qid];
  if(!targetStep) return;
  goStep(targetStep);
  setTimeout(()=>{
    const el = document.getElementById("card_"+qid);
    if(el) el.scrollIntoView({behavior:"smooth", block:"center"});
  },60);
}

function doReset(){
  if(!confirm("これまでの回答をすべて消去して、最初からやり直しますか？この操作は取り消せません。")) return;
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  state = { answers:{}, step:0 };
  const d = new Date(); state.answers.R_DATE = d.toISOString().slice(0,10);
  hasResumed=false;
  lastSavedAt = null;
  renderAll();
}

/* ---------------- export builders ---------------- */
function esc(s){ return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escAttr(s){ return esc(s).replace(/"/g,"&quot;"); }

/* Excel「回答一覧（支援者・AI読み込み用）」と同じ構成: 項目番号 / ブロック / 項目 / おたずね / 回答 / 状態 */
function buildRows(){
  const rows=[];
  BLOCKS.forEach(b=>{
    b.groups.forEach(g=>g.questions.forEach(q=>{
      const st = qStatus(q);
      const shown = st==="入力済" || st==="未入力";
      rows.push({no:q.id, section:b.sheetLabel, label:q.label, prompt:q.prompt, answer: shown ? (state.answers[q.id]||"") : "", status:st});
    }));
  });
  FORM.docs.forEach(d=>{
    rows.push({no:"書類"+d.no, section:"提出書類チェック", label:d.label, prompt:"", answer:state.answers["ST_"+d.id]||FORM.docStates[FORM.docDefault], status:state.answers["NT_"+d.id]||"", isDoc:true});
  });
  return rows;
}

function csvEscape(v){
  v = String(v??"");
  if(/[",\r\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
  return v;
}
function buildCsv(){
  const rows = buildRows();
  let out = "﻿" + ["項目番号","ブロック","項目","おたずね","回答","状態（提出書類は備考）"].map(csvEscape).join(",") + "\r\n";
  out += ["","記入日","","",state.answers.R_DATE||"",""].map(csvEscape).join(",") + "\r\n";
  rows.forEach(r=>{
    out += [r.no, r.section, r.label, r.prompt, r.answer, r.status].map(csvEscape).join(",") + "\r\n";
  });
  return out;
}

function buildReadableText(){
  const rows = buildRows();
  const NL = String.fromCharCode(10);
  let out = `【${FORM.brand}】事業計画ヒアリングフォーム（${FORM.typeName}） 回答控え` + NL;
  out += "事業者名：" + (state.answers["00-01"]||"") + "　代表者：" + (state.answers["00-02"]||"") + "　記入日：" + (state.answers.R_DATE||"") + NL;
  out += "生成日時：" + new Date().toLocaleString("ja-JP") + NL;
  out += "========================================" + NL;
  let curSection="";
  rows.forEach(r=>{
    if(r.status==="対象外" || r.status==="先に選択") return;
    if(r.section!==curSection){ curSection=r.section; out += NL + "■ "+curSection + NL; }
    if(r.isDoc){
      out += "・" + r.label + NL + "  → " + r.answer + (r.status?"（"+r.status+"）":"") + NL;
      return;
    }
    out += "・" + r.no + " " + r.label + (r.status==="未入力"?"【未回答】":"") + NL;
    out += "  → " + (r.answer || "（未回答）") + NL;
  });
  return out;
}

function safeFileBase(){
  const biz = String(state.answers["00-01"]||"事業者").replace(/[/:*?"<>|]/g,"").split(String.fromCharCode(92)).join("");
  const date = (state.answers.R_DATE||"").replace(/-/g,"");
  return `ヒアリング回答_${FORM.short}_${biz}_${date}`;
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove("show"), 2600);
}

function trySaveFile(filename, content, mime){
  try{
    const blob = new Blob([content], {type: mime + ";charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    showToast("保存しました：" + filename);
  }catch(e){
    const ca = document.getElementById("copyArea");
    if(ca){ ca.value = content; ca.scrollIntoView({behavior:"smooth", block:"center"}); }
    showToast("自動保存に失敗したため、下の欄からコピーしてご利用ください");
  }
}
function saveCsv(){ trySaveFile(safeFileBase()+".csv", buildCsv(), "text/csv"); }
function saveTxt(){ trySaveFile(safeFileBase()+".txt", buildReadableText(), "text/plain"); }
async function copyTxt(){
  const text = buildReadableText();
  const ca = document.getElementById("copyArea");
  if(ca) ca.value = text;
  try{
    await navigator.clipboard.writeText(text);
    showToast("コピーしました");
  }catch(e){
    if(ca){ ca.focus(); ca.select(); try{ document.execCommand("copy"); showToast("コピーしました"); }catch(e2){ showToast("コピーできませんでした。テキストを選択してコピーしてください"); } }
  }
}

/* ---------------- init ---------------- */
checkResumeHash();
if(state.step<0 || state.step>=STEP_META.length) state.step = 0;
renderAll();
</script>
</body>

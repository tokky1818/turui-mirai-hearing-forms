<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>つるい未来補助金 ヒアリングフォーム</title>
<style>
:root{
  --bg:#f2f5f3; --surface:#ffffff; --surface-alt:#eaf1ee;
  --text:#1a2624; --text-muted:#5c6f6a; --border:#d7e1dd; --border-strong:#c1cfc9;
  --accent:#1f6f5c; --accent-strong:#154f42; --accent-soft:#e1efe9;
  --shadow:0 1px 2px rgba(20,40,35,.06),0 8px 24px -12px rgba(20,40,35,.18);
  --radius:14px;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  padding:56px 20px 60px;
}
h1,.serif{font-family:"Shippori Mincho",serif;}
.wrap{max-width:720px;margin:0 auto;}
h1{font-size:26px;line-height:1.5;margin:0 0 10px;}
.lead{font-size:13.5px;color:var(--text-muted);line-height:1.8;margin:0 0 36px;}
.cards{display:grid;gap:16px;}
.card{
  display:block;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;box-shadow:var(--shadow);text-decoration:none;color:inherit;transition:border-color .15s,transform .15s;
}
.card:hover{border-color:var(--accent);transform:translateY(-2px);}
.card .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--accent-strong);margin-bottom:6px;}
.card h2{font-size:18px;margin:0 0 8px;font-family:"Shippori Mincho",serif;}
.card p{font-size:13px;color:var(--text-muted);line-height:1.75;margin:0 0 10px;}
.card .go{font-size:12.5px;font-weight:700;color:var(--accent-strong);}
.foot{margin-top:40px;font-size:11.5px;color:var(--text-muted);line-height:1.8;text-align:center;}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1614; --surface:#161f1c; --surface-alt:#1b2521;
    --text:#e6ece9; --text-muted:#9db0ab; --border:#2b3733; --border-strong:#3a4844;
    --accent:#4fae93; --accent-strong:#6fcaad; --accent-soft:#1c332c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  }
}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
</head>
<body>
<div class="wrap">
  <h1 class="serif">つるい未来補助金<br>事業計画ヒアリングフォーム</h1>
  <p class="lead">補助事業の事業計画書づくりに必要な情報を、スマートフォン・タブレット・PCから一問一答形式でご回答いただけます。ご希望の事業の類型をお選びください。</p>
  <div class="cards">
__CARDS__  </div>
  <p class="foot">入力内容はこの端末に一時保存されます。回答完了後、確認画面からファイル保存またはコピーができます。</p>
</div>
</body>
</html>
